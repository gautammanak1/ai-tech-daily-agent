[project]
name = "ai-tech-daily-agent"
version = "1.0.0"
description = "AI Tech Daily — autonomous uAgent that generates daily AI/Web3/tech news articles"
requires-python = ">=3.11"
dependencies = [
  "uagents>=0.24.0",
  "uagents-core>=0.4.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "feedparser>=6.0.0",
  "gitpython>=3.1.0",
  "ddgs>=9.0.0",
  "trafilatura>=2.0.0",
  "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]
