name: Topic Article (manual)

# Run from Actions → Topic Article → Run workflow → enter a topic.
# Posts to GitHub (ai-tech-daily) + Dev.to as a standalone article (NOT in the series).

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Company or topic (e.g. OpenAI, MCP, doc2mcp, LangGraph)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Generate + publish topic article
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ASI_ONE_API_KEY: ${{ secrets.ASI_ONE_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          GIT_USER_NAME: gautammanak1
          GIT_USER_EMAIL: gautammanak1@gmail.com
          DRY_RUN: "false"
          TOPIC: ${{ inputs.topic }}
          DEVTO_JOIN_SERIES: "false"
        run: uv run python agent.py --cli --topic "$TOPIC" --no-series
